[project]
name = "read-thru"
version = "0.1.0"
description = "Turn a codebase into a self-contained, code-level reading guide you can hand to a reviewer."
readme = "README.md"
license = { file = "LICENSE" }
# Widened from the froot-era 3.13 pin for portability — the engine is pure
# Pygments and uses only 3.10+ syntax. uv resolves a suitable interpreter; the
# local pin in .python-version (3.13) is used when present.
requires-python = ">=3.10"
dependencies = [
    "pygments>=2.18",
]

[project.scripts]
read-thru = "read_thru.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["read_thru"]

[tool.ruff]
line-length = 88
target-version = "py310"
